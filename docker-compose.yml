version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env                        # reads LLM_ENDPOINT, LLM_API_KEY, etc.
    environment:
      - DATABASE_URL=sqlite:///./data/stories.db
    volumes:
      - db_data:/app/data           # persists the SQLite file between restarts
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
